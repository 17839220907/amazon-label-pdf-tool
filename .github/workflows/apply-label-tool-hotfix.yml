name: Apply one-time label tool hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch streamlit app
        run: python .github/scripts/apply_hotfix.py
      - name: Remove one-time hotfix files
        run: |
          rm -f .github/workflows/apply-label-tool-hotfix.yml
          rm -f .github/scripts/apply_hotfix.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py .github/workflows/apply-label-tool-hotfix.yml .github/scripts/apply_hotfix.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix label index validation and stop handling"
          git push
